oolimajas viibimine", "num": "5", "text": "Pärast oma õppetundide lõppu lahkub õpilane koolimajast, välja arvatud juhul, kui ta osaleb pikapäevarühmas, konsultatsioonis, huviringis või muus kooliga kokkulepitud tegevuses või ootab koolibussi või huviringi algust."}, {"doc": "Kodukord", "heading": "Koolimajas viibimine", "subheading": "Koolimajas viibimine", "num": "6", "text": "Koolibussi või huviringi ootav õpilane viibib kooli fuajees. Kooli teistes ruumides võib õpilane pärast õppetundide lõppu viibida ainult koolitöötaja juhendamisel või loal."}, {"doc": "Kodukord", "heading": "Kooli territooriumi ja rajatiste kasutamine", "subheading": "Kooli territooriumi ja rajatiste kasutamine", "num": "7", "text": "Kooli territooriumil asuvaid spordi-, mängu- ja vabaajarajatisi kasutatakse heaperemehelikult, sihipäraselt ning viisil, mis ei ohusta kasutajat ega teisi. Kasutamisel järgitakse rajatise juures ja kooli veebilehel avaldatud kasutus- ja ohutusreegleid ning koolitöötaja juhiseid."}, {"doc": "Kodukord", "heading": "Kooli territooriumi ja rajatiste kasutamine", "subheading": "Kooli territooriumi ja rajatiste kasutamine", "num": "8", "text": "Kui rajatis või selle osa on kahjustatud või selle kasutamine võib olla ohtlik, tuleb selle kasutamine viivitamata lõpetada ja teavitada olukorrast koolitöötajat."}, {"doc": "Kodukord", "heading": "Kooli territooriumi ja rajatiste kasutamine", "subheading": "Kooli territooriumi ja rajatiste kasutamine", "num": "9", "text": "Mootorsõiduki, jalgratta ja kergliikuriga sõidetakse ainult liiklemiseks ettenähtud teedel ja aladel. Nendega ei sõideta spordi- ja mängualadel ega tartaankattega pindadel, välja arvatud hooldus- või päästetöödel või kooli loal korraldatud tegevuses."}, {"doc": "Kodukord", "heading": "Kooli territooriumi ja rajatiste kasutamine", "subheading": "Kooli territooriumi ja rajatiste kasutamine", "num": "10", "text": "Rattapargi rajal ei sõideta elektritõukeratta ega muu kergliikuriga. Jalgratas ja kergliikur jäetakse selleks ettenähtud kohta viisil, mis ei takista liikumist ega ohusta teisi."}, {"doc": "Kodukord", "heading": "Kooli territooriumi ja rajatiste kasutamine", "subheading": "Kooli territooriumi ja rajatiste kasutamine", "num": "11", "text": "Kool võib ohutuse, hooldustööde, ilmastikuolude, õppetöö või kooliürituse tõttu rajatise kasutamist ajutiselt piirata."}, {"doc": "Kodukord", "heading": "Õppekavaväline ruumide ja vahendite kasutamine", "subheading": "Õppekavaväline ruumide ja vahendite kasutamine", "num": "12", "text": "Õpilasel on õigus kasutada õppekavaväliseks tegevuseks tasuta kooli rajatisi, ruume, raamatukogu, õppe-, spordi-, tehnilisi ja muid vahendeid eelneval kokkuleppel kogukonnajuhi või muu direktori määratud koolitöötajaga."}, {"doc": "Kodukord", "heading": "Õppekavaväline ruumide ja vahendite kasutamine", "subheading": "Õppekavaväline ruumide ja vahendite kasutamine", "num": "13", "text": "Kokkuleppes määratakse kasutamise eesmärk, aeg ja koht, kasutatavad vahendid ning vajaduse korral tegevuse eest vastutav koolitöötaja ja järelevalve korraldus."}, {"doc": "Kodukord", "heading": "Õppekavaväline ruumide ja vahendite kasutamine", "subheading": "Õppekavaväline ruumide ja vahendite kasutamine", "num": "14", "text": "Kooli korraldatud huviringis või muus regulaarses tegevuses osalev õpilane eraldi kokkulepet ei vaja. Ruumide ja vahendite kasutamise tingimused määrab tegevuse eest vastutav koolitöötaja."}, {"doc": "Kodukord", "heading": "Õppekavaväline ruumide ja vahendite kasutamine", "subheading": "Õppekavaväline ruumide ja vahendite kasutamine", "num": "15", "text": "Õpilane kasutab ruume ja vahendeid sihipäraselt, järgib kasutus- ja ohutusreegleid, jätab ruumi pärast kasutamist korda ning tagastab vahendid kokkulepitud ajal ja seisundis."}, {"doc": "Kodukord", "heading": "Garderoobi kasutamine", "subheading": "Garderoobi kasutamine", "num": "16", "text": "Üleriided jäetakse garderoobi ning välisjalanõud vahetatakse vahetusjalatsite vastu. Vahetusjalatseid hoitakse selleks ettenähtud riiulis või jalatsikotis."}, {"doc": "Kodukord", "heading": "Garderoobi kasutamine", "subheading": "Garderoobi kasutamine", "num": "17", "text": "Garderoob on riiete ja jalanõude hoidmiseks. Muid isiklikke esemeid, sealhulgas õppevahendeid, muusikainstrumente jms, garderoobis ei hoita. Nende hoiukoht lepitakse vajaduse korral kokku koolitöötajaga."}, {"doc": "Kodukord", "heading": "Garderoobi kasutamine", "subheading": "Garderoobi kasutamine", "num": "18", "text": "Raha, dokumente, võtmeid, nutiseadmeid ega muid väärtuslikke esemeid ei jäeta garderoobi ega üleriiete taskutesse."}, {"doc": "Kodukord", "heading": "Garderoobi kasutamine", "subheading": "Garderoobi kasutamine", "num": "19", "text": "Õpilane viibib garderoobis ainult riietumiseks, jalatsite vahetamiseks või oma asjade paigutamiseks ja võtmiseks."}, {"doc": "Kodukord", "heading": "Garderoobi kasutamine", "subheading": "Garderoobi kasutamine", "num": "20", "text": "Õppeaasta lõpus viib õpilane kõik oma isiklikud asjad garderoobist koju. Mahajäetud asju hoitakse kuni 20. juunini. Tähtajaks ära viimata asjad võib kool suunata taaskasutusse või jäätmekäitlusse."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "21", "text": "Õppetunni arvestuslik pikkus on 45 minutit."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "22", "text": "Kahe järjestikuse õppetunni korral võib õpetaja korraldada õppe ühe pikema õppeblokina või kahe eraldi tunnina ning teha õppetöö jooksul õpilaste vajadustest ja õppetegevusest lähtuvaid liikumis- ja puhkepause."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "23", "text": "Õpilane viibib õppetunni alguseks tunniplaanis ettenähtud õpperuumis või tegevuskohas, vajalikud õppevahendid kaasas ning on valmis õppetööd alustama."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "24", "text": "Õppetunni ajal järgib õpilane õpetaja juhiseid ning õpperuumis või tegevuskohas kehtivaid ohutusnõudeid."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "25", "text": "Õpetaja võib õppetöö korraldamiseks määrata või muuta õpilase istekohta."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "26", "text": "Õppetunni lõpetab õpetaja päevakavas ettenähtud ajal. Õpilane lahkub õppetunnist enne selle lõppu ainult õpetaja loal."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "27", "text": "Õppetunni lõpus korrastab õpilane oma töökoha."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "28", "text": "Õppetunni ajal ei sööda ega jooda ning ei närita närimiskummi. Toitu ja jooke hoitakse koolikotis või „muus selleks ettenähtud kohas. Erandina võib õppetunni ajal süüa või juua tervisest tuleneva vajaduse korral või õpetaja loal, kui see on osa õppeülesandest või tuleneb õppetegevuse eripärast."}, {"doc": "Kodukord", "heading": "Õppetunni korraldus", "subheading": "Õppetunni korraldus", "num": "29", "text": "Tehisaru kasutamisel õppetegevuses järgib õpilane õpetaja juhiseid ning kirjalike tööde puhul kooli kirjalike tööde koostamise ja vormistamise nõudeid. Õpilane ei esita enda tööna teise inimese või tehisaru loodud sisu. Kasutatud allikad ja saadud abi märgib õpilane õpetaja juhiste kohaselt. Õpilane vastutab esitatud töö sisu eest ning peab suutma oma tööd ja selles tehtud valikuid selgitada sõltumata kasutatud abivahenditest."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "30", "text": "Vahetund on õppetööst puhkamiseks, liikumiseks ja suhtlemiseks."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "31", "text": "Õppetunnid vahelduvad vähemalt 10-minutilise vahetunniga. Kui kaks õppetundi toimuvad järjest ilma vahetunnita, järgneb neile vähemalt 20-minutiline vahetund."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "32", "text": "Vahetunni ajal järgib õpilane koolitöötajate juhiseid ning viibib vahetunniks ettenähtud kohas."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "33", "text": "Kui õpilase vahetund toimub ajal, mil teistel õpilastel on õppetund, liigub ja suhtleb ta viisil, mis ei häiri toimuvat õppetööd."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "34", "text": "Õpperuumis võib õpilane vahetunni ajal viibida vaid õpetaja loal."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "35", "text": "Õuevahetunnis läheb õpilane õue. Erakorraliste ilmaolude või muu põhjendatud vajaduse korral võib kool õuevahetunni korraldust muuta."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "36", "text": "Koolilõunat süüakse päevakavas õpilasele ettenähtud söögivahetunnil. Koolilõunat ja kaasavõetud toitu süüakse sööklas. Põhjendatud erandjuhul võib koolitöötaja lubada süüa muul ajal või muus kohas."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "37", "text": "Sööklas järgib õpilane koolitöötajate juhiseid ja lauakombeid ning arvestab teistega. Pärast söömist jätab ta oma koha puhtaks ning viib nõud ja jäätmed selleks ettenähtud kohta."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "38", "text": "Koolilõunat ja söökla nõusid ei viida sööklast välja, välja arvatud koolitöötaja loal."}, {"doc": "Kodukord", "heading": "Vahetunnid", "subheading": "Vahetunnid", "num": "39", "text": "Erandina käesolevas alapeatükis sätestatust on dokumendiprojekti hoolikalt läbi lugenud koolitöötajal, kes käesoleva punkti avastab ja sellest koostajale teada annab, õigus nõuda õpetajate toas koolijuhilt šampust ja kalamarja. Nõudeõigus lõpeb kodukorra kehtestamisega."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "40", "text": "Nissi Põhikoolis on ametlik keskkond õppeinfo ja koolikorralduslike teadete edastamiseks ning kooli ja kodu vaheliseks suhtlemiseks eKool."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "41", "text": "Vanemal on kohustus kasutada eKooli vanema rolliga kontot ja jälgida regulaarselt eKooli sissekandeid. Kui vanema juurdepääs eKoolile on ajutiselt takistatud, teavitab ta sellest klassijuhatajat. Vajalik teave edastatakse ajutiselt kooliga kokkulepitud viisil."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "42", "text": "Õpilasel peab alates 1. klassist olema eKooli õpilase rolliga konto. Õpilane õpib vanema toel ning vastavalt oma eale ja oskustele eKooli sissekandeid regulaarselt jälgima."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "43", "text": "Õpetaja teavitab õpilasi poolaasta esimeses õppeaine tunnis peamistest õppeteemadest, vajalikest õppevahenditest, hindamise korraldusest, kokkuvõtva hinde või hinnangu kujunemise põhimõtetest ning sel ajal teada olevatest planeeritavatest üritustest. Sama teave tehakse hiljemalt selle tööpäeva lõpuks eKoolis vanemale kättesaadavaks."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "44", "text": "Õpetaja teatab ulatuslikumast hindelisest õpiülesandest eKoolis vähemalt viis õppepäeva enne selle toimumist. Teates märgitakse töö aeg, hinnatavad teemad või õpitulemused ning hindamise alused. Ulatuslikum hindeline õpiülesanne on kontrolltöö või muu õpiülesanne, mis hõlmab ühe või mitme tervikliku teema olulisi õpitulemusi ja eeldab õpilaselt eelnevat valmistumist."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "45", "text": "Hindelise õpiülesande tulemus ja vajalik tagasiside tehakse eKoolis kättesaadavaks hiljemalt viie õppepäeva jooksul. Mahukama kirjaliku, praktilise või projektitöö puhul tehakse tulemus ja tagasiside kättesaadavaks hiljemalt kümne õppepäeva jooksul. Kui töö laad nõuab pikemat hindamisaega, teatab õpetaja tulemuse avaldamise tähtaja õpilasele enne töö tegemist."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "46", "text": "Poolaasta viimasel viiel õppepäeval ei kavandata ulatuslikke hindelisi õpiülesandeid. Piirangut ei kohaldata järelevastamisele, hinde parandamisele ega õppeprotsessi käigus tehtavale väiksemahulisele õpiülesandele. Kui ulatuslikum hindeline õpiülesanne toimub erandina poolaasta viimasel viiel õppepäeval, ei arvestata selle tulemust sama poolaasta kokkuvõtva hinde või hinnangu kujundamisel."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "47", "text": "Õpetaja teatab koduse töö õpilastele hiljemalt õppetunni lõpuks ning kannab tunni teema ja koduse töö eKooli sama tööpäeva lõpuks."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "48", "text": "Hinded, hinnangud ja kirjalik tagasiside tehakse õpilasele ja vanemale teatavaks eKooli kaudu. 1.–3. klassi õpilased saavad kummagi poolaasta lõpus kokkuvõtvate kirjeldavate hinnangutega pabertunnistuse. 4.–9. klassi õpilased saavad pabertunnistuse õppeaasta lõpus; vanema taotlusel väljastatakse pabertunnistus ka esimese poolaasta lõpus."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "49", "text": "Õpilaste planeerimis- ja enesejuhtimisoskuste toetamiseks võib klassijuhataja klassi vajadustest lähtudes võtta kasutusele õpilaspäeviku või õpimärkmiku. Päevik või märkmik ei asenda eKooli."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "50", "text": "Õppetöö korraldamiseks vajalikud digikeskkonnad on eKool ja Microsoft 365. Kool loob õpilasele Microsoft 365 kasutamiseks nimelise koolikonto ja kooli domeeniga e-posti aadressi. Õppetöös kasutatakse vajaduse korral ka kooli või koolipidaja hangitud digitaalse õppevara keskkondi (nt Opiqu vms). Kool võimaldab õpilasele nende kasutamiseks vajaliku ligipääsu. Õpilane kasutab kooli loodud või talle kasutamiseks antud kontosid ja digikeskkondi õpetaja juhiste ning kooli kehtestatud kasutusreeglite järgi."}, {"doc": "Kodukord", "heading": "Õppeinfo ja hindamisest teavitamine", "subheading": "Õppeinfo ja hindamisest teavitamine", "num": "51", "text": "Õppetöös digikeskkondade ja IKT-vahendite kasutamisel järgitakse dokumendis „Arvutivõrgu, IKT-vahendite ja isiklike seadmete kasutamise kord Nissi Põhikoolis“ sätestatut. Kord avaldatakse kooli veebilehel."}, {"doc": "Kodukord", "heading": "Õppevara kasutamine ja tagastamine", "subheading": "Õppevara kasutamine ja tagastamine", "num": "52", "text": "Kool annab põhikooli õpilasele õppekava läbimiseks vajalikud õpikud, tööraamatud, töövihikud, töölehed ning muu õppevara, sealhulgas digitaalse õppevara, tasuta kasutada."}, {"doc": "Kodukord", "heading": "Õppevara kasutamine ja tagastamine", "subheading": "Õppevara kasutamine ja tagastamine", "num": "53", "text": "Õpilane kasutab koolilt saadud õppevara sihipäraselt ja hoolikalt. Tagastatavasse õpikusse või muusse õppevarasse ei tehta märkmeid ega muid püsivaid muudatusi, välja arvatud koolitöötaja loal."}, {"doc": "Kodukord", "heading": "Õppevara kasutamine ja tagastamine", "subheading": "Õppevara kasutamine ja tagastamine", "num": "54", "text": "Õpilane tagastab tagastamisele kuuluva õppevara kooli või raamatukogu teatatud tähtajal ning koolist lahkumisel hiljemalt viimaseks õppepäevaks. Kooli või raamatukogu põhjendatud nõudel tagastatakse õppevara ka varem."}, {"doc": "Kodukord", "heading": "Õppevara kasutamine ja tagastamine", "subheading": "Õppevara kasutamine ja tagastamine", "num": "55", "text": "Õppevara kadumisest või kahjustumisest teatab õpilane viivitamata aineõpetajale, klassijuhatajale või raamatukoguhoidjale. Õpilane ei vastuta õppevara sihipärase kasutamisega kaasneva tavapärase kulumise eest."}, {"doc": "Kodukord", "heading": "Õppevara kasutamine ja tagastamine", "subheading": "Õppevara kasutamine ja tagastamine", "num": "56", "text": "Kadunud või tavapärasest kasutamisest suuremal määral kahjustatud tagastatava õppevara asendamine või tekitatud kahju hüvitamine lahendatakse koos õpilase ja vanemaga õigusaktides sätestatud korras, arvestades õpilase vanust, teo tahtlikkust või hooletust ning muid juhtumi asjaolusid."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "57", "text": "Õpilane osaleb päevakavas või individuaalses õppekavas ettenähtud õppes. Õppest puudumine on lubatud üksnes mõjuval põhjusel."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "58", "text": "Mõjuvad puudumise põhjused on õpilase haigestumine või talle tervishoiuteenuse osutamine, läbimatu koolitee või muu vääramatu jõud, oluline perekondlik põhjus, kooli esindamine või osalemine kooliga kokkulepitud tegevuses ning muu kooli poolt mõjuvaks loetud põhjus. Puudumise põhjuse mõjuvust hindab kool."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "59", "text": "Vanem teavitab kooli õpilase puudumisest ja selle põhjusest eKooli kaudu hiljemalt puudumise esimesel õppepäeval. Ette teada olevast puudumisest teatatakse võimaluse korral enne puudumise algust. Kui eKooli kasutamine ei ole võimalik, teatatakse puudumisest klassijuhatajale muul kokkulepitud viisil."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "60", "text": "Kui koolil on põhjendatud kahtlus puudumise põhjenduseks esitatud andmete õigsuses, võib kool küsida vanemalt puudumise põhjuse mõjuvuse hindamiseks vajalikku lisaselgitust."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "61", "text": "Kui vanem ei ole puudumisest teatanud, võtab kool temaga ühendust hiljemalt järgmisel õppepäeval. Kui puudumise põhjust ei õnnestu välja selgitada või õpilase õppimiskohustuse täitmine on ohus, kaasab kool vajaduse korral kohaliku omavalitsuse seaduses sätestatud korras."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "62", "text": "Kui õpilasel tekib koolipäeva jooksul terviseprobleem või muu ootamatu olukord, mis takistab õppetöös osalemist või võib tingida vajaduse koolist lahkuda, teatab ta sellest viivitamata klassijuhatajale või teisele koolitöötajale. Enne õpilase lahkumist võtab kool ühendust vanemaga ja lepib kokku, kas ning kuidas õpilane koolist lahkub. Vahetu ohu korral helistab kool hädaabinumbril 112 ja teavitab vanemat esimesel võimalusel. Kui õpilane lahkub koolipäeva jooksul vanemaga kokkuleppel, märgib klassijuhataja puudumise põhjuse eKooli ja vanem ei pea täiendavalt puudumistõendit lisama."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "63", "text": "Õppest puudumine ei vabasta õpilast õpitulemuste saavutamisest. Õpilane selgitab vastavalt oma eale ja võimetele vanema toel välja puudumise ajal käsitletud õppesisu ja õpetaja määratud õpiülesanded, omandab õppesisu ning täidab õpiülesanded."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "64", "text": "Pikema puudumise või puudumisest tekkinud õpiraskuste korral lepivad kool, õpilane ja vanem kokku, kuidas toetada õpitulemuste saavutamist. Vajaduse korral kaasab kool õpilase toe kavandamisse ja korraldamisse koolis kokkulepitud töökorralduse kohaselt selleks vajalikud koolitöötajad."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "65", "text": "Vanema otsusel ette kavandatud ja õppetööga mitteseotud puudumisest teavitamine ei ole koolilt loa taotlemine. Õpilane ja vanem korraldavad puudumise ajal käsitletud õppesisu omandamise ja õpiülesannete täitmise, kasutades eKoolis avaldatud teavet, õppematerjale ning kooli tavapäraseid konsultatsioone. Õpetajal ei ole kohustust puudutud õppetunde individuaalselt korrata ega koostada õpilasele puudumise tõttu eraldi õppematerjale või -ülesandeid."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "66", "text": "Koolis viibiv õpilane osaleb kõigis tunniplaanijärgsetes õppetundides. Tervisest tulenev tegevuspiirang ning tunniks vajalike riiete, vahendite või materjalide puudumine ei vabasta tunnis osalemisest. Õpilane osaleb tunnis õpetaja määratud sobival viisil või täidab muud õppeülesannet ning teda ei loeta puudujaks."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "67", "text": "Tervisest tulenevast tegevuspiirangust teavitab vanem eKooli vestluse kaudu aineõpetajat. Kui piirang puudutab mitut õppeainet või kestab pikemalt, teavitab vanem klassijuhatajat, kes annab info õpetajatele edasi. Teavitusse lisatakse õppetöö ajutiseks kohandamiseks vajalik info, näiteks tegevuspiirang ja selle eeldatav kestus."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "68", "text": "Kui pikemalt kestva tegevuspiirangu tõttu ei piisa tavapärasest õppetöö kohandamisest, lepivad kool, õpilane ja vanem kokku, kuidas õpilane osaleb õppes ja saavutab õpitulemused."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "69", "text": "Puudumised ja hilinemised märgitakse eKooli. Hilinenud õpilane liitub õppetööga õpetaja juhiste järgi. Puudumiste ja hilinemiste arv kajastub klassitunnistusel. Seda ei käsitata mõjutusmeetme ega õpitulemuse hindamisena."}, {"doc": "Kodukord", "heading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "subheading": "Õppimiskohustuse täitmine, hilinemine ja puudumine", "num": "70", "text": "Kui puudumiste või hilinemiste sagedus, nende koondumine kindlatele õppepäevadele või õppeainetele või nendega kaasnevad õppevõlgnevused annavad alust arvata, et õpilane vajab tuge, selgitab kool koostöös õpilase ja vanemaga välja olukorra põhjused. Vajaduse korral kaasab kool koolis kokkulepitud töökorralduse kohaselt olukorra lahendamisse õpilase toetamiseks vajalikud koolitöötajad ning lepib kokku edasised tegevused."}, {"doc": "Kodukord", "heading": "Kiitmine ja tunnustamine", "subheading": "Kiitmine ja tunnustamine", "num": "71", "text": "Tunnustamise eesmärk on märgata ja väärtustada õpilase õpitulemusi, arengut, pingutust, eeskujulikku käitumist, algatusvõimet, koostööd ning panust klassi, kooli või kogukonna ellu."}, {"doc": "Kodukord", "heading": "Kiitmine ja tunnustamine", "subheading": "Kiitmine ja tunnustamine", "num": "72", "text": "Tunnustus valitakse saavutuse või panuse iseloomu ja tähtsuse järgi ning antakse võimaluse korral vahetult. Tunnustusviise võib kasutada eraldi või koos ning nende tabelis esitamise järjekord ei näita nende tähtsust."}, {"doc": "Kodukord", "heading": "Kiitmine ja tunnustamine", "subheading": "Kiitmine ja tunnustamine", "num": "73", "text": "1.–3. klassi ja 4.–9. klassi õpilaste tunnustamisel lähtutakse samadest põhimõtetest, arvestades kooliastmes kasutatavat hindamisviisi."}, {"doc": "Kodukord", "heading": "Kiitmine ja tunnustamine", "subheading": "Kiitmine ja tunnustamine", "num": "74", "text": "Tunnustamise ettepaneku võib teha õpetaja, klassijuhataja, muu koolitöötaja või kooli juhtkonna liige, kui tabelis ei ole ette nähtud teisiti. Tunnustamise otsustab tabelis (Tabel 1) nimetatud isik või õppenõukogu."}, {"doc": "Kodukord", "heading": "Kiitmine ja tunnustamine", "subheading": "Kiitmine ja tunnustamine", "num": "75", "text": "Riiklikult reguleeritud tunnustused on kiituskiri „Väga hea õppimise eest“, kiituskiri „Väga heade tulemuste eest üksikus õppeaines“ ja kiitusega põhikooli lõputunnistus. Kiituskirjade andmise tingimused ja korra kehtestab õppenõukogu. Õpilase tunnustamise kiituskirja või kiitusega põhikooli lõputunnistusega otsustab õppenõukogu."}, {"doc": "Kodukord", "heading": "Kiitmine ja tunnustamine", "subheading": "Kiitmine ja tunnustamine", "num": "76", "text": "Tunnustusega võib kaasneda raamat, kooli meene, diplom, medal, karikas või muu mitterahaline meene. Meene valikul arvestatakse tunnustamise põhjust, saavutuse iseloomu ja kooli võimalusi. Tabel 1. Kiitmine ja tunnustamine Nissi Põhikoolis. +----------------------------------------------------------+------------------------------------------------------------------------------------------------------- -----------------------------+ | Kooli tänukiri                                           | -   Hindamisperioodi lõpus silmapaistva saavutuse või kooli eduka esindamise eest.                                                                                                                                                                                     | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   9. klassi põhikooli lõpuaktusel õpilasele, kes on põhikooli jooksul märkimisväärselt panustanud kooliellu, kooli esindanud või koolivälise tegevusega koolile tunnustust toonud.                                                                                   | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Ettepaneku võib teha õpetaja, klassijuhataja, juhendaja või muu koolitöötaja. Tänukirja andmise otsustab direktor.                                                                                                                                                 | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Kooli tänukaart                                          | -   Õpilasele erilise teo, hoolivuse, algatusvõime, vastutustundlikkuse, hea koostöö või klassi- või kooliellu panustamise eest.                                                                                                                                       | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Vanemale hea koostöö või kooliellu panustamise eest.                                                                                                                                                                                                               | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Ettepaneku tänukaardi andmiseks võib teha iga koolitöötaja. Tänukaardi andmise ja selle üleandja otsustab kooli juhtkond.                                                                                                                                          | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Tänukaardi annab kooli nimel üle koolitöötaja tunnustuse põhjusele ja saajale sobivas olukorras.                                                                                                                                                                   | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Riiklikult reguleeritud tunnustused                      |                                                                                                                                                                                                                                                                        | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Kiituskiri „Väga hea õppimise eest“                      | -   Kiituskirjaga võib tunnustada kõikide klasside õpilasi õppeaasta lõpus.                                                                                                                                                                                            | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   1.–3. klassi õpilase tunnustamisel l  teadmiste ja oskuste, märkimisväärse arengu, iseseisva panuse või olümpiaadil, konkursil või võistlusel saavutatud väga hea tulemuse eest.                                        | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   1.–8. klassi õpilast tunnustatakse õppeaasta lõpus ja 9. klassi õpilast põhikooli lõpuaktusel.                                                                                                                                                                     | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Ettepaneku teeb aineõpetaja, lisades põhjenduse. Tunnustamise otsustab õppenõukogu.                                                                                                                                                                                | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Kiituskirja „Väga hea õppimise eest“ saamine ei välista ainekiituskirja andmist.                                                                                                                                                                                   | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Kiitusega põhikooli lõputunnistus                        | -   Kiitusega põhikooli lõputunnistusel tunnustatakse 9. klassi õpilast, kelle kõik lõputunnistusele kantavate õppeainete viimased aastahinded on väga head.                                                                                                           | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Tunnustamise otsustab õppenõukogu.                                                                                                                                                                                                                                 | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Tunnustustega kaasnevad meened ja auhinnad               |                                                                                                                                                                                                                                                                        | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Kooli meene                                              | Tunnustustega kaasnevad meened:                                                                                                                                                                                                                                        | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Hindamisperioodi lõpus kooli eduka esindamise või muu silmapaistva saavutuse eest.                                                                                                                                                                                 | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   9. klassi põhikooli lõpuaktusel väga heade või heade ja väga heade õpitulemuste, kooli eduka esindamise või pikaajalise kooliellu panustamise eest.                                                                                                                | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Ettepaneku tunnustusele kooli meene lisamiseks võib teha õpetaja, klassijuhataja, juhendaja või muu koolitöötaja. Meene andmise otsustab kooli juhtkond.                                                                                                           | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Raamat                                                   | -   1.–8. klassi õpilasele õppeaasta lõpus väga heade või heade ja väga heade õpitulemuste eest, kui käitumist ja hoolsust kokkuvõttev hinnang on „vastab ootustele“.                                                                                                  | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Klassijuhataja põhjendatud ettepanekul võib raamatuga tunnustada ka õpilast, kellel on üksik madalam õpitulemus, kuid kes on õppeaasta jooksul silma paistnud suure pingutuse, märkimisväärse arengu, vastutustundlikkuse või muu tunnustamist vääriva tegevusega. | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Kõigile 9. klassi õpilastele põhikooli lõpetamisel.                                                                                                                                                                                                                | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Ettepaneku raamatuga tunnustamiseks teeb klassijuhataja. Raamatu andmise otsustab direktor ja vormistab otsuse käskkirjaga.                                                                                                                                        | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+ | Diplom, medal, karikas või muu auhind                    | -   Kooli korraldatud konkursil, võistlusel, spordiüritusel või muul mõõduvõtmisel saavutatud tulemuse eest vastavalt ürituse tingimustele.                                                                                                                            | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Tunnustuse saajad ja auhindade liigid määratakse kindlaks ürituse tingimustes või otsustab need ürituse korraldaja tulemuste põhjal.                                                                                                                               | |                                                          |                                                                                                                                                                                                                                                                        | |                                                          | -   Kooli raha eest soetatavad auhinnad kooskõlastatakse enne üritust vastavalt kooli töökorraldusele ja eelarvelistele võimalustele.                                                                                                                                  | +----------------------------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+"}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "1", "text": "Tugi- ja mõjutusmeetmete eesmärk on toetada õpilast, suunata teda kooli kodukorra kohaselt käituma ja teistest lugu pidama ning ennetada turvalisust ohustavaid olukordi. Meede peab olema põhjendatud, olukorraga sobiv ja proportsionaalne ning arvestama õpilase vanust, arengut ja toe vajadust. Meetmeid võib rakendada eraldi või koos ning loetletud meetmete kasutamise järjestus ei ole kohustuslik."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "2", "text": "Mõjutusmeetme rakendamise otsustab direktor või tema volitatud isik, välja arvatud ajutine õppes osalemise keeld, mille rakendamise otsustab õppenõukogu."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "3", "text": "Käitumisprobleemi korral peatab kool esmalt ohtliku või teisi häiriva tegevuse, kuulab õpilase ära ning selgitab välja käitumise põhjuse ja toe vajaduse. Enne meetme otsustamist võimaldatakse õpilasel anda selgitusi ja talle põhjendatakse meetme valikut. Ajutise õppes osalemise keelu puhul võimaldatakse arvamus esitada ka vanemal."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "4", "text": "Õpilase toetamiseks võib kool kasutada näiteks arenguvestlust, konsultatsiooni, individuaalset õppekava, õppekorralduse või õpiülesannete kohandamist, tugispetsialisti teenust, käitumise tugikava, pikapäevarühma või muud õpilase vajadusele vastavat ja seadusega kooskõlas olevat tuge. Vajaduse korral kaasab kool toe kavandamisse ja korraldamisse koolis kokkulepitud töökorralduse kohaselt selleks vajalikud koolitöötajad."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "5", "text": "Mõjutusmeetme rakendamise otsustab direktor või tema volitatud isik. Õpilase suhtes võib rakendada üht või mitut järgmist mõjutusmeedet: -   õpilase käitumise arutamine vanemaga; -   õpilasega tema käitumise arutamine direktori või õppejuhi juures; -   õpilasele tugiisiku määramine; -   kirjalik noomitus; -   sellise eseme või aine hoiule võtmine, mis ei ole koolis keelatud, kuid mida õpilane kasutab kodukorraga vastuolus oleval viisil; -   põhjendatud kahtluse korral, et õpilase valduses on keelatud ese või aine, selle olemasolu kontrollimine ja äravõtmine õpilase valdusest; -   keelatud eseme või aine hoiule võtmine; -   õpilase õppetunnist eemaldamine koos kohustusega viibida määratud kohas ja saavutada tunni lõpuks nõutavad õpitulemused; -   konfliktis osalenud poolte lepitamine, et leppida kokku edasine tegevus; -   kooli jaoks kasuliku, eakohase ja turvalise tegevuse tegemine koolitöötaja juhendamisel ning täisealise õpilase nõusolekul või alaealise õpilase puhul vanema nõusolekul; -   kohustus viibida pärast õppetundide lõppu koolis ja teha määratud tegevust kuni 1,5 tunni jooksul ühe õppepäeva kohta; -   ajutine keeld osaleda kooli õppekavavälises tegevuses, näiteks üritusel või väljasõidul; -   ajutine õppes osalemise keeld koos kohustusega saavutada selle aja lõpuks nõutavad õpitulemused."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "6", "text": "Kirjaliku noomituse ettepaneku esitab direktorile kirjalikult klassijuhataja, aineõpetaja või muu koolitöötaja. Ettepanekus kirjeldatakse noomituse aluseks olevat juhtumit, selle aega ja olulisi asjaolusid ning lisatakse olemasolevad juhtumit kinnitavad materjalid. Kirjaliku noomituse otsustab direktor ja see vormistatakse põhjendatud käskkirjaga. Ettepanek ja selle aluseks olevad materjalid säilitatakse käskkirja alusdokumentidena. Käskkiri tehakse õpilasele teatavaks ja edastatakse vanemale eKooli kaudu või muul kirjalikul viisil."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "7", "text": "Olukorra selgitamiseks võib kool paluda osalistel anda suulise või kirjaliku selgituse. Kirjalik selgitus ei ole karistus. Vajadusel võib koolitöötaja õpilast selgituse kirjutamisel abistada."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "8", "text": "Eseme, mida õpilane kasutab kodukorraga vastuolus oleval viisil või koolitöötaja korraldust eirates, võib kool võtta õppepäeva lõpuni hoiule. Hoiulevõtmise põhjus ja eseme tagastamine dokumenteeritakse."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "9", "text": "Keelatud eseme või aine omamise põhjendatud kahtluse korral selgitab koolitöötaja õpilasele olukorda ning teeb talle ettepaneku võimaldada oma esemete kontrolli või anda keelatud ese/aine vabatahtlikult üle. Kontroll toimub delikaatselt ja üldjuhul teiste õpilaste juuresolekuta, vajaduse korral teist koolitöötajat kaasates."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "10", "text": "Õpilase tahte vastaselt võib keelatud eseme või aine olemasolu kontrollida ainult direktor või direktori määratud ja selleks ettevalmistatud koolitöötaja, järgides seaduses sätestatud tingimusi. Kontrollimisel tuleb kaitsta õpilase väärikust. Õpilase riietust kontrolliv isik peab olema temaga samast soost, välja arvatud juhul, kui samast soost kontrollijat ei ole võimalik kaasata ja viivitamine seaks ohtu kellegi elu, tervise või vara. Samast soost kontrollija nõue ei kehti õpilase esemete ega tema kasutuses oleva suletud kapi kontrollimisel."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "11", "text": "Keelatud eseme kontrollimise, ära- või hoiulevõtmise juures viibib lisaks kontrollijale vähemalt üks koolitöötaja. Meede protokollitakse seaduses sätestatud korras. Relva, lõhkeaine või narkootilise joobe tekitamiseks kasutatava aine annab kool viivitamata politseile. Muud keelatud esemed ja ained tagastatakse vanemale pärast õpilase käitumise arutamist või antakse nende ohtlikkust arvestades üle politseile."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "12", "text": "Õppetunnist eemaldatud õpilane viibib kooli määratud kohas järelevalve all, täidab talle antud õpiülesandeid ning saab vajaduse korral abi õppimisel."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "13", "text": "Pärast õppetundide lõppu koolis viibimise kohustuse rakendamisel arvestatakse õpilase kojusõiduvõimalustega. Õpilane viibib selle aja jooksul järelevalve all ja saab vajaduse korral pedagoogilist juhendamist."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "14", "text": "Ajutist õppes osalemise keeldu võib rakendada kuni kümneks õppepäevaks ühe poolaasta jooksul. Õpilasele koostatakse koostöös tema ja vanemaga individuaalne õppekava. Vanem tagab keelu ajal õpilase järelevalve ja õppe korraldamise individuaalse õppekava kohaselt."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "15", "text": "Ajutise õppes osalemise keelu otsus vormistatakse kirjalikult. Otsuses märgitakse meetme põhjus, kestus, õppekorraldus ja vaidlustamise võimalused. Otsus toimetatakse õpilasele või alaealise õpilase puhul vanemale kätte posti teel või antakse kätte allkirja vastu. Kool võib otsusest täiendavalt teavitada eKooli või e-posti kaudu."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "16", "text": "Vanemat teavitatakse meetmest eKooli kaudu või muul kirjalikul viisil, kui meetme laad või mõju seda eeldab. Keelatud eseme kontrollimisest, äravõtmisest või hoiule võtmisest ning pärast õppetundide lõppu koolis viibimise kohustusest teavitatakse vanemat viivitamata. Ajutisest keelust osaleda õppekavavälises tegevuses teavitatakse vanemat kirjalikku taasesitamist võimaldavas vormis."}, {"doc": "Kodukord", "heading": "Tugi- ja mõjutusmeetmed", "subheading": "Tugi- ja mõjutusmeetmed", "num": "17", "text": "Meetme rakendaja märgib eKooli meetme valiku, rakendamise ja edasiste kokkulepete seisukohalt vajaliku teabe. Kirjalikud otsused ja seaduse järgi nõutavad protokollid registreeritakse kooli dokumendihaldussüsteemis."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "18", "text": "Nissi Põhikoolis on koolipäev nutivaba. Selle eesmärk on toetada õppimist, keskendumist, vahetut suhtlemist, õpilaste vaimset ja füüsilist heaolu, vastutustundliku digikäitumise ning turvalise õpikeskkonna kujunemist."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "19", "text": "Nutivaba koolipäev tähendab, et õpilane ei kasuta oma tunniplaanijärgsete õppetundide ja nendevaheliste vahetundide ajal koolimajas isiklikku nutiseadet, välja arvatud käesolevas peatükis sätestatud juhul."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "20", "text": "Isikliku nutiseadmena käsitatakse mobiiltelefoni, nutikella, tahvelarvutit, sülearvutit, kõrvaklappe ja muud suhtlemist, meelelahutust või salvestamist võimaldavat isiklikku digiseadet."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "21", "text": "Õppetundide ja nendevaheliste vahetundide ajal hoiab õpilane isiklikku nutiseadet, välja arvatud nutikella, hääletul režiimil ja ilma vibratsioonimärguanneteta koolikotis või muus kokkulepitud kohas. Soovitatavalt on seade välja lülitatud või lennurežiimil. Nutikella võib kanda, kuid selle teavitused peavad olema välja lülitatud ning seda kasutatakse ainult kella vaatamiseks, välja arvatud õpetaja loal või kokkulepitud erandi korral."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "22", "text": "Kooliõues võib õpilane kasutada nutiseadet enne oma tunniplaanijärgsete õppetundide algust, pärast nende lõppu ning vahetundide ajal. Pärast tunniplaanijärgsete õppetundide lõppu võib õpilane kasutada nutiseadet ka koolibussi või huviringi oodates fuajees. Nutiseadme kasutamine ei tohi häirida teiste tegevust, ohustada kasutajat või teisi ega rikkuda salvestamist ja salvestiste kasutamist käsitlevaid reegleid."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "23", "text": "Õues toimuva õppetöö, kooliürituse või muu kooli korraldatud tegevuse ajal kasutatakse nutiseadet ainult tegevuse eest vastutava koolitöötaja loal. Pikapäevarühmas, konsultatsioonis, huviringis või muus kooli korraldatud tegevuses määrab nutiseadmete kasutamise korra tegevuse eest vastutav koolitöötaja.."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "24", "text": "Õpetaja võib õppetööks sobiva keskkonna tagamiseks nõuda, et õpilased asetaksid isiklikud nutiseadmed õppetunni alguses õpetaja määratud turvalisse hoiukohta. Õpilane asetab seadme hoiukohta ise ja võtab selle pärast õppetunni lõppu tagasi."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "25", "text": "Õpetaja võib lubada isikliku nutiseadme kasutamist õppetunnis või muus õppetegevuses kindlal eesmärgil ja enda juhiste kohaselt. Isikliku seadme olemasolu ei ole õppetöös osalemise eeltingimus."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "26", "text": "Tervisest või hariduslikust erivajadusest tuleneva erandi otsustab direktor või tema määratud koolitöötaja, leppides seadme kasutamise tingimused kokku õpilase ja vanemaga. Muul põhjendatud juhul, sealhulgas kiireloomuliseks ühenduse võtmiseks vanemaga, võib õpilane kasutada nutiseadet koolitöötaja loal."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "27", "text": "Kooli korraldatud õppekäigul, väljasõidul või muul väljaspool kooli toimuval tegevusel määrab isiklike nutiseadmete kasutamise korra tegevuse eest vastutav koolitöötaja ning teavitab sellest õpilasi enne tegevust."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "28", "text": "Nutiseadmega pildistamisel, filmimisel ja helisalvestamisel järgitakse käesoleva kodukorra salvestamist ja salvestiste kasutamist käsitlevas peatükis sätestatut ka juhul, kui seadme kasutamine on muidu lubatud."}, {"doc": "Kodukord", "heading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "subheading": "Nutivaba koolipäev ja isiklike nutiseadmete kasutamine", "num": "29", "text": "Kui õpilane kasutab isiklikku nutiseadet kodukorraga vastuolus, reageerib koolitöötaja rahulikult ja selgitavalt ning annab õpilasele korralduse kasutamine lõpetada ja seade ära panna. Korralduse eiramise või korduva rikkumise korral võib kool rakendada tugi- ja mõjutusmeetmeid käsitlevas peatükis sätestatud meetmeid, sealhulgas võtta seadme ajutiselt hoiule."}, {"doc": "Kodukord", "heading": "Õpilaspileti kasutamise kord", "subheading": "Õpilaspileti kasutamise kord", "num": "30", "text": "Õpilaspilet on õpilase Nissi Põhikoolis õppimist tõendav dokument. Kool väljastab õpilaspileti pärast õpilase arvamist kooli õpilaste nimekirja. Õpilaspileti taotluse esitab vanem vabas vormis kooli üldmeilile kool@nissikool.ee ning selles märgitakse õpilase nimi ja klass ning lisatakse vajadusel õpilaspileti vormistamiseks sobiv digitaalne foto. Õpilaspilet väljastatakse tasuta."}, {"doc": "Kodukord", "heading": "Õpilaspileti kasutamise kord", "subheading": "Õpilaspileti kasutamise kord", "num": "31", "text": "Õpilaspilet on isiklik. Õpilane hoiab seda hoolikalt, ei anna seda kasutamiseks teisele isikule ning esitab selle, kui see on vajalik õpilase isiku või õpilasstaatuse tuvastamiseks või õpilaspiletiga seotud teenuse kasutamiseks."}, {"doc": "Kodukord", "heading": "Õpilaspileti kasutamise kord", "subheading": "Õpilaspileti kasutamise kord", "num": "32", "text": "Õpilaspiletit võib kasutada sõiduõiguse tõendamiseks või sõidu valideerimiseks õpilas- ja ühistranspordis. Kui transporditeenuse kasutamise tingimused seda nõuavad, kannab õpilane kehtivat õpilaspiletit kaasas."}, {"doc": "Kodukord", "heading": "Õpilaspileti kasutamise kord", "subheading": "Õpilaspileti kasutamise kord", "num": "33", "text": "Õpilaspileti rikkumisest, hävimisest, kadumisest või vargusest teavitab õpilane või vanem kooli viivitamata. Uue õpilaspileti saamiseks saadab vanem põhjendatud kirjaliku taotluse aadressile kool@nissikool.ee. Uut õpilaspiletit taotletakse ka õpilase nime või isikukoodi muutumise korral."}, {"doc": "Kodukord", "heading": "Õpilaspileti kasutamise kord", "subheading": "Õpilaspileti kasutamise kord", "num": "34", "text": "Õpilaspileti kehtivus pikeneb elektroonilises süsteemis automaatselt, kui õpilane jätkab Nissi Põhikoolis õppimist. Kool märgib füüsilisele õpilaspiletile igal õppeaastal uue kehtivuskuupäeva."}, {"doc": "Kodukord", "heading": "Õpilaspileti kasutamise kord", "subheading": "Õpilaspileti kasutamise kord", "num": "35", "text": "Õpilase koolist väljaarvamisel tagastab õpilane või vanem õpilaspileti koolile. Kool hävitab tagastatud õpilaspileti õigusaktis sätestatud korras."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "36", "text": "Igaühel on õigus vaimselt ja füüsiliselt turvalisele koolikeskkonnale. Kiusamine, vägivald, ähvardamine, alandamine ja muu turvalisust kahjustav käitumine ei ole lubatud."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "37", "text": "Turvalise koolikeskkonna loomises osalevad kõik koolipere liikmed, järgides kokkuleppeid ja ohutusnõudeid, arvestades teistega ning teatades ohust või abi vajavast inimesest."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "38", "text": "Kool korraldab õpilaste üle järelevalve kogu õppepäeva jooksul. Vahetundides toimub järelevalve kooli korrapidamise korralduse järgi. Ohtu või sekkumist vajavat olukorda märganud koolitöötaja sekkub oma pädevuse piires ja kutsub vajadusel abi."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "39", "text": "Koolimajja sisenev külastaja teatab oma saabumisest kantseleisse või vastuvõtvale koolitöötajale ning järgib koolitöötaja juhiseid. Koolitöötajal on õigus paluda isikul, kelle koolimajas viibimiseks puudub põhjendatud eesmärk, koolimajast lahkuda."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "40", "text": "Vaimset või füüsilist turvalisust ohustavast olukorrast, sealhulgas kiusamisest, vägivallast või ähvardamisest, teatab õpilane viivitamata lähimale või enda valitud usaldusväärsele koolitöötajale. Juhtumist teatamine on enda ja teiste kaitsmine."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "41", "text": "Juhtumist teada saanud koolitöötaja lõpetab võimaluse korral ohtliku tegevuse, tagab kannatanule vajaliku abi, kutsub vahetu ohu korral abi numbril 112 ning teavitab esimesel võimalusel direktorit või tema määratud koolitöötajat."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "42", "text": "Kool selgitab juhtumi asjaolud, kuulab asjaosalised ära, dokumenteerib juhtumi lahendamiseks vajaliku teabe ning teavitab asjaosaliste õpilaste vanemaid. Teavet jagatakse ulatuses, mis ei kahjusta teiste isikute õigusi ega avalda põhjendamatult nende isikuandmeid."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "43", "text": "Kiusamisjuhtumi lahendamisel arvestab kool, et kiusamine võib olla korduv ning asjaosaliste vahel võib esineda jõudude ebavõrdsus. Kool rakendab oma pädevuse piires meetmeid kiusava käitumise lõpetamiseks ja õpilase turvalisuse toetamiseks koolis ning jälgib rakendatud meetmete mõju."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "44", "text": "Kui väljaspool kooli või digikeskkonnas toimuv kiusamine mõjutab õpilase turvalisust, heaolu või õppetööd koolis, tegeleb kool juhtumiga oma pädevuse piires ning kaasab vajaduse korral vanemad või pädevad asutused."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "45", "text": "Vajaduse korral kaasab kool juhtumi lahendamisse tugispetsialisti, kooliõe, koolipidaja, lastekaitsetöötaja, politsei või muu pädeva asutuse ning rakendab käesoleva kodukorra tugi- ja mõjutusmeetmete peatükis sätestatud meetmeid."}, {"doc": "Kodukord", "heading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "subheading": "Vaimse ja füüsilise turvalisuse tagamine ning juhtumitest teavitamine", "num": "46", "text": "Häda- või kriisiolukorras tegutsetakse kooli dokumendi „Nissi Põhikooli hädaolukorra lahendamise plaan“ kohaselt ning järgitakse koolitöötajate ja päästeasutuste korraldusi."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "47", "text": "Nissi Põhikool kasutab koolimaja koridorides ja kooli territooriumil ööpäevaringselt videovalvet turvalisust ohustavate olukordade ennetamiseks ja neile reageerimiseks ning kooli vara kaitseks. Kaameraid ei kasutata õpperuumides, tualettides, riietus- ega pesemisruumides kohtades."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "48", "text": "Jälgimisseadmestikku ei kasutata õpilaste või koolitöötajate pidevaks jälgimiseks ega nende käitumise, töösoorituse või õppetöö kontrollimiseks. Salvestisi kasutatakse üksnes eesmärgil, milleks jälgimisseadmestik on kasutusele võetud."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "49", "text": "Videovalve kasutamisest teavitatakse enne jälgitavale alale sisenemist paigaldatud tähistustega. Täpsem teave videovalve korraldaja, eesmärkide, õigusliku aluse ja isiku õiguste kohta avaldatakse kooli veebilehel."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "50", "text": "Salvestistele on juurdepääs direktoril ja tema määratud koolitöötajatel, kellele on juurdepääs vajalik tööülesannete täitmiseks. Salvestisi vaadatakse ainult põhjendatud vajaduse korral turvalisust ohustava olukorra või kooli vara kahjustamisega seotud juhtumi lahendamiseks, seadusest tuleneva kohustuse täitmiseks või salvestisele jäänud isiku taotluse lahendamiseks."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "51", "text": "Salvestisi ei edastata kolmandatele isikutele, välja arvatud seaduses sätestatud juhul. Kui on alust arvata, et salvestisele on jäänud süütegu, edastab kool salvestise esimesel võimalusel politseile. Muule pädevale asutusele edastatakse salvestis seadusliku nõude alusel."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "52", "text": "Salvestisele jäänud isik või tema seaduslik esindaja võib esitada enda kohta käivate andmetega tutvumiseks kirjaliku taotluse kooli e-posti aadressil kool@nissikool.ee. Taotluses märgitakse võimalikult täpselt salvestamise kuupäev, ajavahemik ja asukoht."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "53", "text": "Kool võimaldab taotlejal enda kohta käivate andmetega tutvuda viisil, mis kaitseb teiste salvestisele jäänud isikute õigusi. Üldjuhul võimaldatakse salvestise asjakohase osaga tutvuda kooli ruumides. Taotlus ei anna õigust tutvuda teiste isikute andmetega ega saada töötlemata originaalsalvestist. Vajaduse korral piirab kool näidatavat ajavahemikku või vaateala, muudab teised isikud tuvastamatuks või kasutab muud sobivat lahendust."}, {"doc": "Kodukord", "heading": "Jälgimisseadmestiku kasutamine", "subheading": "Jälgimisseadmestiku kasutamine", "num": "54", "text": "Jälgimisseadmestiku salvestisi säilitatakse kuni üks kuu salvestamise päevast arvates, pärast mida need kustutatakse või kirjutatakse automaatselt üle."}, {"doc": "Kodukord", "heading": "Salvestamine ja salvestiste kasutamine", "subheading": "Salvestamine ja salvestiste kasutamine", "num": "55", "text": "Käesolevas peatükis käsitatakse salvestamisena pildistamist, filmimist, helisalvestamist ja otseülekande tegemist sõltumata kasutatavast seadmest. Peatükki kohaldatakse kooli territooriumil ja kooli korraldatud tegevustes."}, {"doc": "Kodukord", "heading": "Salvestamine ja salvestiste kasutamine", "subheading": "Salvestamine ja salvestiste kasutamine", "num": "56", "text": "Õppetunnis ja muus mitteavalikus kooli korraldatud tegevuses võib salvestada ainult tegevuse eest vastutava koolitöötaja loal, kindlaksmääratud eesmärgil ja tema juhiste kohaselt."}, {"doc": "Kodukord", "heading": "Salvestamine ja salvestiste kasutamine", "subheading": "Salvestamine ja salvestiste kasutamine", "num": "57", "text": "Kool salvestab koolielu ja kooliüritusi ning kasutab tehtud salvestisi ainult õigusliku aluse olemasolul, eesmärgipäraselt ja võimalikult vähesel määral. Eelistatakse üldvaateid ja lahendusi, mille puhul õpilased ei ole tuvastatavad. Salvestamine ei tähenda automaatselt salvestise avalikustamist."}, {"doc": "Kodukord", "heading": "Salvestamine ja salvestiste kasutamine", "subheading": "Salvestamine ja salvestiste kasutamine", "num": "58", "text": "Kui kool salvestab avalikku kooliüritust selle kajastamise ja salvestiste avalikustamise eesmärgil, teavitatakse osalejaid eelnevalt salvestamisest, selle eesmärgist ja kavandatud avaldamiskanalitest. Võimaluse korral jäetakse salvestamist vältida soovivatele isikutele võimalus kaamera vaateväljast kõrvale jääda."}, {"doc": "Kodukord", "heading": "Salvestamine ja salvestiste kasutamine", "subheading": "Salvestamine ja salvestiste kasutamine", "num": "59", "text": "Kui kool soovib avalikustada tuvastatava lapse salvestise ja avalikustamiseks puudub muu õiguslik alus, küsitakse lapse seaduslikult esindajalt nõusolek konkreetse eesmärgi ja avaldamiskanali kohta. Arvestatakse ka lapse vanuse ja arengutasemega sobival viisil väljendatud arvamust."}, {"doc": "Kodukord", "heading": "Salvestamine ja salvestiste kasutamine", "subheading": "Salvestamine ja salvestiste kasutamine", "num": "60", "text": "Kui isikliku seadme kasutamine on käesoleva kodukorra kohaselt lubatud, võib isiklikuks tarbeks salvestada viisil, mis ei häiri õppetööd ega muud tegevust ning ei kahjusta teiste isikute õigusi ja privaatsust. Tuvastatavat isikut sisaldava salvestise avalikustamiseks või isiklikust kasutusest väljapoole jagamiseks peab salvestise tegijal olema õiguslik alus, näiteks salvestisele jäänud isiku või lapse puhul tema seadusliku esindaja nõusolek."}, {"doc": "Kodukord", "heading": "Salvestamine ja salvestiste kasutamine", "subheading": "Salvestamine ja salvestiste kasutamine", "num": "61", "text": "Ajakirjanduslikul eesmärgil salvestamine koolimajas või mitteavalikul kooli korraldatud tegevusel toimub kooliga eelneval kokkuleppel."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "1", "text": "Nissi Põhikooli õppekava (edaspidi õppekava) on kooli õppe- ja kasvatustegevuse alusdokument. Õppekavas täpsustatakse riiklikes õppekavades sätestatut ning kirjeldatakse kooli eripärast tulenevaid valikuid, õppekorraldust ja õppekava rakendamise põhimõtteid."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "2", "text": "Õppekava koostamisel lähtutakse põhikooli- ja gümnaasiumiseadusest, põhikooli riiklikust õppekavast, põhikooli lihtsustatud riiklikust õppekavast ning kooli arengukavast."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "3", "text": "Õppekava rakendatakse Nissi Põhikooli 1.–9. klassi õpilaste õppe- ja kasvatustegevuse korraldamisel."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "4", "text": "Õppekava koosneb: -   üldosast; -   põhikooli riiklikust õppekavast lähtuvatest ainevaldkondade kavadest, mille juurde kuuluvad õppeainete ja kooli valikõppeainete ainekavad; -   põhikooli lihtsustatud riiklikust õppekavast lähtuvatest ning vastavalt koolis rakendatavale õppele koostatud õppeainete ainekavadest või tegevusvaldkondade kavadest."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "5", "text": "Õppekava rakendamisega seotud õppeaasta tegevused, tähtajad ja vastutajad määratakse kooli üldtööplaanis."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "6", "text": "Õppekava koostamist, rakendamist ja arendamist korraldab direktor. Õppekava koostamises ja arendamises osalevad kooli õppe- ja kasvatusalal töötavad isikud. Õppekava koostamisse kaasatakse õpilasi, lapsevanemaid ja teiste huvirühmade esindajaid."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "7", "text": "Õppekava vaadatakse üle õigusaktide, riiklike õppekavade, kooli arengukava või õppekorralduse muutumisel ning juhul, kui kooli tegevuse analüüs näitab muutmise vajadust."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "8", "text": "Õppekava ja selle muudatused esitatakse enne kehtestamist arvamuse andmiseks hoolekogule, õpilasesindusele ja õppenõukogule."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "9", "text": "Õppekava ja selle muudatused kehtestab direktor."}, {"doc": "Õppekava", "heading": "Üldsätted", "subheading": "Üldsätted", "num": "10", "text": "Õppekava avalikustatakse kooli veebilehel ning sellega saab tutvuda koolis. Muudatused viiakse õppekava tervikteksti ning terviktekstis märgitakse nende jõustumise aeg."}, {"doc": "Õppekava", "heading": "Kooli põhiväärtused", "subheading": "Kooli põhiväärtused", "num": "1", "text": "Õppe- ja kasvatustegevuses lähtutakse riiklikes õppekavades sätestatud alusväärtustest ning kooli põhiväärtustest. Väärtused väljenduvad koolipere igapäevastes valikutes, omavahelistes suhetes, õppekorralduses ja õpikeskkonna kujundamises."}, {"doc": "Õppekava", "heading": "Kooli põhiväärtused", "subheading": "Kooli põhiväärtused", "num": "2", "text": "Kooli põhiväärtused ja nende rakendamise põhimõtted on järgmised: -   Mitmekesine põhiharidus. Kool toetab iga õpilase võimetekohast õppimist ning vaimset, kehalist, sotsiaalset ja emotsionaalset arengut. Õpilastele luuakse võimalused kujundada teadmisi, oskusi ja hoiakuid, mis toetavad edasisi õpinguid ja elukestvat õppimist. -   Kaasaegne õppekeskkond. Kool kujundab turvalise, õppimist toetava ja eakohase füüsilise, digitaalse ning sotsiaalse õppekeskkonna. Õppemeetodeid ja tehnoloogiat kasutatakse eesmärgipäraselt, lähtudes õpieesmärkidest ja õppijate vajadustest. -   Hoolivus ja head suhted. Koolis koheldakse iga inimest väärikalt, märgatakse abivajajat ning toetatakse üksteist. Erimeelsusi lahendatakse lugupidavalt ja vastutustundlikult. Oluliseks peetakse usalduslikke suhteid ja iga koolipere liikme kuuluvustunnet. -   Traditsioonid. Kool väärtustab Eesti kultuuri, kohalikku pärandit ning kooli väljakujunenud traditsioone. Traditsioonide hoidmine ühendatakse avatusega uuendustele ja muutustele. -   Avatus ja koostöö. Kool teeb koostööd õpilaste, töötajate, vanemate, vilistlaste, kogukonna ja teiste partneritega. Õpilasi kaasatakse nende õppimist ja koolielu puudutavatesse tegevustesse ning otsustesse eakohasel viisil."}, {"doc": "Õppekava", "heading": "Kooli eripära", "subheading": "Kooli eripära", "num": "3", "text": "Nissi Põhikooli moto on „Sild sinu tulevikku“."}, {"doc": "Õppekava", "heading": "Kooli eripära", "subheading": "Kooli eripära", "num": "4", "text": "Nissi Põhikool on kogukonnaga seotud põhikool, mille õppekeskkonda rikastavad kohalik loodus, kultuuripärand ja koostöövõimalused. Kooli ümbritsevat keskkonda kasutatakse võimaluse korral õuesõppeks, liikumiseks, praktiliseks õppimiseks ning erinevate õppeainete lõimimiseks."}, {"doc": "Õppekava", "heading": "Kooli eripära", "subheading": "Kooli eripära", "num": "5", "text": "Kool ühendab väljakujunenud traditsioonid õppimist toetavate uuendustega. Õppe- ja kasvatustegevuses pööratakse tähelepanu õpimotivatsioonile, tõhusate õpistrateegiate kujundamisele, õpilase järk-järgult suurenevale vastutusele ning tehnoloogia eesmärgipärasele kasutamisele."}, {"doc": "Õppekava", "heading": "Kooli eripära", "subheading": "Kooli eripära", "num": "6", "text": "Kool seob õppetööd huvitegevuse, projektide, õppekäikude, koolisündmuste ja kogukondliku koostööga. Need tegevused toetavad õppekava eesmärkide saavutamist, õpilaste loovust, ettevõtlikkust, koostööoskust ja kuuluvustunnet."}, {"doc": "Õppekava", "heading": "Kooli eripära", "subheading": "Kooli eripära", "num": "7", "text": "Kool toetab õpilaste individuaalset arengut, tagades vajadusest lähtuva õpiabi ja tugiteenuste kättesaadavuse ning luues suuremat väljakutset vajavatele õpilastele pingutust ja süvenemist võimaldavaid õpiülesandeid."}, {"doc": "Õppekava", "heading": "Kooli eripära", "subheading": "Kooli eripära", "num": "8", "text": "Õpilaste osalemist koolielu kujundamisel toetatakse õpilasesinduse, ühiste ettevõtmiste ning õpilaste algatuste kaudu. Õpilaste arvamusi võetakse arvesse, lähtudes nende vanusest ja arengutasemest ning otsuse mõjust õpilastele."}, {"doc": "Õppekava", "heading": "Kooli õppe- ja kasvatuseesmärgid", "subheading": "Kooli õppe- ja kasvatuseesmärgid", "num": "9", "text": "Õppe- ja kasvatustegevuse eesmärk on toetada iga õpilase kujunemist teadmishimuliseks, ennastjuhtivaks, koostöövõimeliseks, vastutustundlikuks ja hoolivaks inimeseks, kes saavutab võimetekohased õpitulemused, oskab õpitut kasutada ning on valmis edasisteks õpinguteks ja iseseisvaks toimetulekuks."}, {"doc": "Õppekava", "heading": "Kooli õppe- ja kasvatuseesmärgid", "subheading": "Kooli õppe- ja kasvatuseesmärgid", "num": "10", "text": "Eesmärgi saavutamiseks kool: -   toetab riiklikes õppekavades kirjeldatud üld-, kooliastme- ja valdkonna­pädevuste kujunemist ning õpitulemuste saavutamist; -   seob õpitava õpilase varasemate teadmiste, igapäevaelu, teiste õppeainete ning kohaliku keskkonnaga, et õppimine oleks mõtestatud; -   õpetab õpilastele tõhusaid õpistrateegiaid ning annab neile järk-järgult suurema vastutuse eesmärkide seadmise, õppimise kavandamise, sobivate strateegiate valimise, abi küsimise ja oma õppimise analüüsimise eest; -   toetab õpimotivatsiooni, pakkudes õpilastele eakohaseid valikuid ja osalemisvõimalusi, jõukohast pingutust nõudvaid ülesandeid, arengut toetavat tagasisidet ning usalduslikke suhteid; -   arvestab õpilaste võimete ja õpivajadustega, võimaldades õigel ajal vajalikku tuge või suuremat väljakutset; -   arendab õpilaste kriitilist mõtlemist, loovust, koostööoskust, ettevõtlikkust ning oskust kasutada teavet ja tehnoloogiat eesmärgipäraselt, turvaliselt ja vastutustundlikult; -   toetab õpilaste vaimset, kehalist ja sotsiaalset heaolu ning kujundab turvalise ja õppimist toetava koolikeskkonna; -   toetab eesti keele ja kultuuri, kohaliku identiteedi, looduskeskkonna ning inimeste ja kultuuride mitmekesisuse väärtustamist; -   valmistab õpilasi ette teadlike haridus- ja karjäärivalikute tegemiseks, edasisteks õpinguteks ning ühiskonnaelus osalemiseks."}, {"doc": "Õppekava", "heading": "Õppekorralduse üldised alused", "subheading": "Õppekorralduse üldised alused", "num": "11", "text": "Õpe korraldatakse kooli õppekava, päevakava ja tunniplaani alusel, arvestades õpilaste vanust, õpivajadusi, õppekoormust ning turvalise ja õppimist toetava keskkonna põhimõtteid."}, {"doc": "Õppekava", "heading": "Õppekorralduse üldised alused", "subheading": "Õppekorralduse üldised alused", "num": "12", "text": "Õppeaasta jaguneb kõigis klassides kaheks poolaastaks, mis on ühtlasi hindamisperioodid. Poolaastate algus- ja lõppkuupäevad ning kehtestatud koolivaheajad märgitakse kooli üldtööplaanis."}, {"doc": "Õppekava", "heading": "Õppekorralduse üldised alused", "subheading": "Õppekorralduse üldi
